<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Doctor y Paciente</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f7ff;
    padding: 30px;
}

h1 {
    text-align: center;
    color: #1d4ed8;
}

.chat {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px #aaa;
}

.linea {
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
}

.doctor {
    background: #dbeafe;
}

.paciente {
    background: #dcfce7;
}

button {
    display: block;
    margin: 20px auto;
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
}
</style>

</head>

<body>

<h1>Doctor and Patient Conversation</h1>

<div class="chat" id="chat"></div>

<button onclick="hablar()">🔊 Escuchar conversación</button>

<script>

let dialogo = [];

async function cargarDialogo(){

    // Leer la lista de archivos
    const respuesta = await fetch("dialogos/manifest.json");
    const archivos = await respuesta.json();

    // Elegir uno al azar
    const archivo = archivos[Math.floor(Math.random() * archivos.length)];

    // Cargar el JS
    const script = document.createElement("script");
    script.src = "dialogos/" + archivo;

    script.onload = function(){

        const chat = document.getElementById("chat");

        dialogo.forEach(linea=>{

            const div = document.createElement("div");

            div.className = "linea " + linea.clase;
            div.dataset.voz = linea.voz;
            div.innerHTML = "<b>" + linea.personaje + ":</b> " + linea.texto;

            chat.appendChild(div);

        });

    };

    document.body.appendChild(script);

}

function hablar(){

    speechSynthesis.cancel();

    let frases = document.querySelectorAll(".linea");
    let indice = 0;

    function siguiente(){

        if(indice>=frases.length) return;

        let voz = new SpeechSynthesisUtterance(frases[indice].innerText);

        voz.lang = frases[indice].dataset.voz;
        voz.rate = 0.9;
        voz.pitch = 1;

        voz.onend = function(){

            indice++;
            siguiente();

        };

        speechSynthesis.speak(voz);

    }

    siguiente();

}

cargarDialogo();

</script>

</body>
</html>
